<title>Skills and Agents Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Language" content="en-US">
<style>
/* Layout: one reading column, grouped lists, filter box on top. Mine first, then plugins and built-ins. */
:root{
  --bg:#f5f7f7; --panel:#ffffff; --fg:#14201f; --muted:#556563; --line:#d9e1e0; --accent:#0d6b63; --accent-soft:#dff0ee; --tag:#eef2f2;
  --display:"Fraunces", Georgia, serif; --body:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1716; --panel:#162221; --fg:#e4efed; --muted:#9bb0ad; --line:#2a3b39; --accent:#58c4b8; --accent-soft:#1b3330; --tag:#1d2c2a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716; --panel:#162221; --fg:#e4efed; --muted:#9bb0ad; --line:#2a3b39; --accent:#58c4b8; --accent-soft:#1b3330; --tag:#1d2c2a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin-inline:auto;padding-block:32px 64px}
h1{font-family:var(--display);font-size:2rem;line-height:1.15;margin:0 0 6px;text-wrap:balance;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px;text-wrap:pretty}
h2{font-family:var(--display);font-size:1.3rem;margin:36px 0 4px;font-weight:600;text-wrap:balance}
.note{color:var(--muted);font-size:13.5px;margin:0 0 12px;text-wrap:pretty}
#q{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.counts span{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:4px 16px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-family:var(--mono);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.row span{color:var(--muted);text-wrap:pretty}
.tag{display:inline-block;background:var(--tag);color:var(--muted);font-size:11.5px;padding:1px 7px;border-radius:4px;margin-left:6px;white-space:nowrap}
.empty{color:var(--muted);margin-top:24px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">

<div class="wrap">
  <h1>Skills and Agents Inventory</h1>
  <p class="sub">What is available as of 2026-10-26. Yours come first, then plugin and built-in ones. Source: inventory.md in the personal repo.</p>
  <input id="q" type="search" placeholder="Filter by name or description" aria-label="Filter">
  <div class="counts" id="counts"></div>
  <div id="out"></div>
  <p class="empty" id="none" hidden>Nothing matches that filter.</p>
</div>

<script>
var G = [{"t":"Your skills","n":"Edited in the personal repo, under skills/. Installed into every session by the cloud setup script and the local links.","i":[["personal-voice","Your stance, tone, sentence rules, email openers and banned words. Loaded before drafting anything written as you."],["de-slop","Rewrites text to strip AI tells and match your voice, plus the company voice file when the repo has one."],["document-review","Reviews a document in four passes, in order: substance, slop, bloat, clarity."],["expert-panel","Adversarial expert panel on a decision: independent opinions, cross-examination, fact check, disagreement map. Runs inline in chat."],["ai-research-digest","Weekly routine only. Method, scoring rules and source list for the AI research report. Not for normal sessions.","routine only"]]},{"t":"Your skill in the Cuepri workspace","n":"Lives in cuepri-workspace/.claude/skills/. Loads only in sessions that start in that repo.","i":[["cuepri-design","Cuepri design system: tokens, type, components, UI kits and brand assets for interfaces and mocks."]]},{"t":"Your agents in the consultant workspace","n":"Live in consultant-workspace/.claude/agents/. They run only in that repo. All are read-only. The review panel rules in its AGENTS.md say when each is required.","i":[["consulting-expert","Adversarial senior consultant. Reviews outward drafts, prices, scope, call prep and recommendations.","opus"],["prospect-voice","Simulated behavioral health owner-operator reading your work as the buyer. Output is [opinion, simulated], never evidence.","opus"],["matt-proxy","Answers one question: would you accept this, given your hours, skills, risk appetite and stop rule. A proxy, never your decision.","sonnet"],["implementation-architect","For every technical idea: simplest version, build-nothing alternative, costs in hours and dollars, vendor facts with verification status.","opus"],["ledger-audit","Mechanical check of the assertions ledger in open-questions.md against the wiki and the setup-map page.","haiku, low effort"],["question-audit","Checks each question against the repo before anyone is asked: already answered, decision it changes, who should answer, narrower wording.","sonnet"]]},{"t":"Your agent at user level","n":"Lives in the personal repo, under agents/. Installed into ~/.claude/agents/ by install.js.","i":[["karpathy-structural-review","Reviews any structural change (new repo, folder, automation, removal) against the LLM-wiki principles and the repo’s own rules. Will recommend removal.","no model set"]]},{"t":"Built-in agents","n":"Ship with Claude Code. Available in every session.","i":[["claude","Catch-all agent with every tool."],["general-purpose","Multi-step research and search when the first tries miss."],["Explore","Read-only fan-out search across many files."],["Plan","Designs implementation plans. Read-only."],["claude-code-guide","Answers questions about Claude Code, the Agent SDK and the API."],["statusline-setup","Configures the Claude Code status line."]]},{"t":"Slack plugin skills","n":"slack-by-salesforce. Needs the Slack connector authorized; it was not authorized in the 2026-10-26 session.","i":[["slack-by-salesforce:channel-digest","Digest of recent activity across several channels."],["slack-by-salesforce:draft-announcement","Drafts a formatted announcement and saves it as a draft."],["slack-by-salesforce:find-discussions","Finds discussions on a topic across channels."],["slack-by-salesforce:standup","Standup update from your recent Slack activity."],["slack-by-salesforce:summarize-channel","Summarizes recent activity in one channel."],["slack-by-salesforce:slack-messaging","Guidance for well-formatted Slack messages."],["slack-by-salesforce:slack-search","Guidance for effective Slack search."]]},{"t":"Legal plugin skills","n":"legal. Connectors for Box, DocuSign and Egnyte were not authorized in the 2026-10-26 session.","i":[["legal:brief","Daily legal summary, topic research or incident briefing."],["legal:compliance-check","Regulations, approvals and risk areas for a proposed action."],["legal:legal-response","Templated responses to common legal inquiries, with escalation checks."],["legal:legal-risk-assessment","Severity-by-likelihood risk classification."],["legal:meeting-briefing","Briefings for meetings with legal relevance, plus action tracking."],["legal:review-contract","Clause-by-clause contract review against a playbook, with redlines."],["legal:signature-request","Pre-signature checklist and routing for e-signature."],["legal:triage-nda","Classifies an NDA as green, yellow or red."],["legal:vendor-check","Status of agreements with a vendor across systems."]]},{"t":"Sales plugin skills","n":"sales. Most need a CRM, email or calendar connector. In the 2026-10-26 session the sales connectors needed authorization and the HubSpot one failed to connect.","i":[["sales:setup","First-run setup. Checks what is connected and learns your writing style."],["sales:daily-briefing","Morning rundown of meetings, deals and waiting emails."],["sales:end-of-day","Closes the day: calls processed, CRM current, tomorrow teed up."],["sales:weekly-wrap","End-of-week summary of what closed, moved and slipped."],["sales:account-research","Research a prospect company or contact."],["sales:account-context","360 view of an existing account."],["sales:account-plan","Strategic account plan, synced to the CRM."],["sales:account-tiering","Scores and tiers accounts against ICP fit."],["sales:call-prep","Pre-call brief."],["sales:call-summary","Transcript to follow-up email, internal summary and CRM updates."],["sales:draft-outreach","Outreach email or sequence draft."],["sales:inbox-sweep","Classifies customer email and drafts replies."],["sales:lead-triage","Scores and routes an inbound lead."],["sales:route-lead","Ownership and handoff for unrouted leads."],["sales:schedule-meeting","Finds a time, drafts the invite, logs it to the CRM."],["sales:log-activity","Logs a call or email to the CRM after the fact."],["sales:update-opportunity","Guided opportunity updates with before and after."],["sales:crm-hygiene-check","Read-only audit of CRM opportunities."],["sales:pipeline-review","Stage-by-stage pipeline health."],["sales:team-pipeline","Leader roll-up by rep and stage."],["sales:rep-context","Leader prep before a 1:1."],["sales:forecast","Commit, best-case and pipeline narrative."],["sales:deal-review","Deep dive on one opportunity."],["sales:deal-advance-gap","What is missing to advance a deal."],["sales:deal-signals","Alert digest: quiet deals, slipping dates, champion changes."],["sales:deal-slip-scenario","Models the impact if a deal slips or dies."],["sales:close-plan","Business case and mutual action plan."],["sales:stakeholder-map","Roles, influence and gaps in an account."],["sales:handle-objection","Works through a live objection or competitor threat."],["sales:competitive-intelligence","Competitor analysis and battlecards."],["sales:win-loss-review","Patterns in closed-won and closed-lost."],["sales:customer-voice","Attributed customer quotes on a topic."],["sales:customer-health","Account health and QBR prep."],["sales:renewal-radar","Upcoming renewals and risk."],["sales:expansion-whitespace","Upsell and expansion opportunities."],["sales:create-an-asset","Customer deck, one-pager or leave-behind."]]},{"t":"Anthropic document and workspace skills","n":"anthropic-skills. Formats, Google Workspace, browsers and research.","i":[["anthropic-skills:docx","Word documents."],["anthropic-skills:pptx","PowerPoint decks."],["anthropic-skills:xlsx","Excel spreadsheets and CSVs."],["anthropic-skills:pdf","PDF files."],["anthropic-skills:docs","Claude Docs."],["anthropic-skills:google-workspace","Google Workspace tasks."],["anthropic-skills:deep-research","Multi-source research synthesized into a report."],["anthropic-skills:skill-creator","Builds a new skill."],["anthropic-skills:import-memory","Imports memory from elsewhere."],["anthropic-skills:morning","Morning routine skill."],["anthropic-skills:built-in-browser","Uses the browser pane in the desktop app."],["anthropic-skills:chrome-browser","Uses Claude in Chrome."],["anthropic-skills:computer-use","Controls apps on your computer."]]},{"t":"Claude Code skills","n":"Built into Claude Code.","i":[["code-review","Reviews a diff or PR for bugs at a chosen effort level."],["simplify","Reviews changed code for reuse and simplification, then applies fixes."],["security-review","Security review of pending changes."],["init","Creates a CLAUDE.md for a codebase."],["run","Launches the project’s app to see a change working."],["loop","Runs a prompt on a recurring interval."],["update-config","Edits settings.json: hooks, permissions, env vars."],["fewer-permission-prompts","Builds a read-only allowlist from your transcripts."],["keybindings-help","Customizes keyboard shortcuts."],["session-start-hook","Sets up startup hooks for cloud sessions."],["claude-api","Reference for the Claude API and SDK."],["plugin-authoring","Writes plugin hooks that reload live."],["workflow-authoring","Reference for writing Workflow scripts."]]},{"t":"Plugin and artifact skills","n":"Cowork plugin management, and the guidance that applies when publishing a page.","i":[["cowork-plugin-management:cowork-plugin-customizer","Tailors a plugin to an organization’s tools."],["cowork-plugin-management:create-cowork-plugin","Creates a plugin from scratch in Cowork."],["artifact-design","Design guidance for Artifact pages. Loaded before any publish."],["artifact-diagramming","Diagrams inside Artifacts."],["artifact-capabilities","Runtime capabilities for Artifact pages."],["dataviz","Guidance for charts and dashboards."]]}];
var out=document.getElementById("out"), counts=document.getElementById("counts"), q=document.getElementById("q"), none=document.getElementById("none");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var html="", tot=0, mine=0;
G.forEach(function(g,gi){
  tot+=g.i.length; if(gi<4) mine+=g.i.length;
  html+='<section><h2>'+esc(g.t)+' ('+g.i.length+')</h2><p class="note">'+esc(g.n)+'</p><div class="list">'+
    g.i.map(function(r){return '<div class="row"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+(r[2]?'<em class="tag" style="font-style:normal">'+esc(r[2])+'</em>':'')+'</span></div>'}).join("")+'</div></section>';
});
out.innerHTML=html;
counts.innerHTML='<span>'+tot+' total</span><span>'+mine+' yours</span><span>'+G[2].i.length+' agents in the consultant workspace</span>';
q.addEventListener("input",function(){
  var v=q.value.toLowerCase(), shown=0;
  out.querySelectorAll("section").forEach(function(s){
    var any=false;
    s.querySelectorAll(".row").forEach(function(r){
      var m=!v||r.textContent.toLowerCase().indexOf(v)>-1; r.hidden=!m; if(m){any=true;shown++;}
    });
    s.hidden=!any;
  });
  none.hidden=shown>0;
});
</script>
